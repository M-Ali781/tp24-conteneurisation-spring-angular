version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: smarthouse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart-house
    ports:
      - "3306:3306"
    networks:
      - smarthouse-network

  backend:
    build:
      context: ./Smart_Home_back
    container_name: smarthouse-backend
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart-house?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - smarthouse-network

  frontend:
    build:
      context: ./smartHome-front
    container_name: smarthouse-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smarthouse-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smarthouse-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - smarthouse-network

networks:
  smarthouse-network:
    driver: bridge
